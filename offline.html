<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1118">
    <title>Offline — Ahmed Belal</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="css/control-plane.css">
    <style>
      body { min-height: 100svh; display: grid; place-items: center; background: #0b1118; color: white; }
      .offline { width: min(100% - 2rem, 36rem); padding: clamp(1.5rem, 6vw, 3rem); border: 1px solid #2a3744; border-radius: 1.5rem; background: #101821; }
      .offline-mark { display: grid; width: 3rem; height: 3rem; margin-bottom: 2rem; place-items: center; border-radius: .7rem; background: #2563eb; font-family: "IBM Plex Mono", monospace; }
      .offline h1 { margin-bottom: 1rem; font-size: clamp(2rem, 9vw, 4rem); line-height: 1.04; letter-spacing: -.05em; }
      .offline p { margin-bottom: 2rem; color: #a9b4bf; }
      .offline .button { width: 100%; }
    </style>
  </head>
  <body>
    <main class="offline">
      <span class="offline-mark" aria-hidden="true">AB</span>
      <p class="eyebrow eyebrow-dark">Network state / offline</p>
      <h1>The control plane is temporarily unreachable.</h1>
      <p>Your cached portfolio content remains available where previously visited. Reconnect, then retry the request.</p>
      <a class="button button-primary" href="/">Retry connection</a>
    </main>
  </body>
</html>
