# Deploy the static runtime only; repository notes and CI files stay private to the artifact.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install minification tool
        run: npm install -g esbuild@0.28.2

      - name: Stage public site
        run: |
          mkdir -p _site
          cp index.html 404.html offline.html CNAME favicon.ico manifest.json \
            robots.txt sitemap.xml humans.txt _site/
          cp -R .well-known css fonts images js _site/
          touch _site/.nojekyll

      - name: Minify static assets
        run: |
          for file in _site/css/*.css; do
            esbuild "$file" --minify --log-level=warning --outfile="$file.min"
            mv "$file.min" "$file"
            echo "Minified: $file"
          done
          for file in _site/js/*.js; do
            esbuild "$file" --minify --format=esm --log-level=warning --outfile="$file.min"
            mv "$file.min" "$file"
            echo "Minified: $file"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
