# Deploy the static runtime only; repository notes and CI files stay private to the artifact.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install minification tools
        run: npm install -g clean-css-cli@5.6.3 terser@5.51.2

      - name: Stage public site
        run: |
          mkdir -p _site
          cp index.html 404.html offline.html CNAME favicon.ico manifest.json \
            robots.txt sitemap.xml humans.txt _site/
          cp -R .well-known css fonts images js _site/
          touch _site/.nojekyll

      - name: Minify static assets
        run: |
          for file in _site/css/*.css; do
            cleancss -o "$file" "$file"
            echo "Minified: $file"
          done
          for file in _site/js/*.js; do
            terser "$file" -o "$file" -c -m
            echo "Minified: $file"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
