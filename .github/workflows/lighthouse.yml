name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start local static server
        run: |
          python3 -m http.server 8000 > /tmp/cloudycode-http.log 2>&1 &
          echo $! > /tmp/cloudycode-http.pid
          sleep 2

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@12.6.2
        with:
          urls: |
            http://127.0.0.1:8000
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
