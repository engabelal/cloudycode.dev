<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#fcfcfa">
    <title>404 — Ahmed Belal</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="stylesheet" href="/css/control-plane.css">
    <style>
      body { min-height: 100svh; display: grid; place-items: center; }
      .not-found { width: min(100% - 2rem, 48rem); padding-block: 3rem; }
      .not-found-code { color: #2563eb; font: 500 clamp(5rem, 30vw, 12rem)/.8 "IBM Plex Mono", monospace; letter-spacing: -.08em; }
      .not-found h1 { margin: 2rem 0 1rem; font-size: clamp(2rem, 8vw, 4rem); line-height: 1.05; letter-spacing: -.05em; }
      .not-found p { max-width: 34rem; color: #66717d; }
    </style>
  </head>
  <body>
    <main class="not-found">
      <p class="eyebrow">Route state / not found</p>
      <div class="not-found-code" aria-hidden="true">404</div>
      <h1>This route is outside the system boundary.</h1>
      <p>The page may have moved or the address may be incorrect. Return to the portfolio control plane.</p>
      <a class="button button-primary" href="/">Return home</a>
    </main>
  </body>
</html>
